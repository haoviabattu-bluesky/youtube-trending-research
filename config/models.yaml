# VIDEO HUNT V2 — model/provider cho từng gate (guide §23). KHÔNG hard-code model ở file khác.
# Verify thật 2026-09-22 (docs/scratch/ping_h2dev.txt + probe trong phiên):
#   ramclouds gemini-3.8-flash  OK (chậm lúc cao điểm: 160s/ping) — BẮT BUỘC stream:true + User-Agent
#   ns24      gemini-3.8-flash  OK 8.8s — dự phòng, cùng luật stream/UA
#   hhtech    gpt-5.6-sol       OK 3.1s non-stream chuẩn OpenAI
#   claude_cli sonnet           OK — `claude -p --model sonnet` dùng gói Claude Code, không tốn API key
# Key: RAMCLOUDS_API_KEY / NS24_API_KEY / HHTECH_API_KEY trong config/.env (LLM_API_KEY cũ chỉ có
# quyền gemini-3.5-flash-low, KHÔNG truy cập được gemini-3.8-flash — đã probe "no access").

providers:
  ramclouds:
    kind: openai_http
    base_url: https://ramclouds.me/v1
    key_env: RAMCLOUDS_API_KEY
    stream: true            # non-stream trả 200 + SSE rỗng = mất trắng nội dung (bài học h2dev)
    user_agent: true        # thiếu → Cloudflare 403 code 1010
  ns24:
    kind: openai_http
    base_url: https://api.ns24.io/v1
    key_env: NS24_API_KEY
    stream: true
    user_agent: true
  hhtech:
    kind: openai_http
    base_url: https://hhtechapi.net/v1
    key_env: HHTECH_API_KEY
    stream: false
    user_agent: false
  claude_cli:
    kind: claude_cli        # subprocess `claude -p` — chạy trên máy đã đăng nhập Claude Code
    command: claude
  claude_lite:              # "Claude gọn" (anh duyệt 21/10/2026): --tools "" --strict-mcp-config --safe-mode
    kind: claude_cli        # --system-prompt-file → nền ~0,8k token/lượt thay vì ~7k. Model ghi TÊN ĐẦY ĐỦ,
    command: claude         # effort khai ở gate (`effort:`). Vẫn ăn quota gói Claude — chỉ dùng model nhỏ.
    lite: true

gates:
  semantic_format:          # H4 + H5 gộp 1 call — bulk classifier, ưu tiên rẻ
    chain:
      - [ramclouds, gemini-3.8-flash]
      - [ns24, gemini-3.8-flash]
      - [claude_cli, sonnet]            # dự phòng cuối: đo thật 2026-09-22 cả 2 đường gemini cùng
                                        # chết (ramclouds >180s, ns24 upstream_error) → sonnet 16s, free
    timeout_s: 150
    max_tokens: 6000
    temperature: 0.1
    prompt_version: semantic_format_v1
  opportunity:              # H7 — Claude (sonnet qua Claude Code, không mất tiền API)
    chain:
      - [claude_cli, sonnet]
      - [ramclouds, gemini-3.8-flash]   # fallback chỉ để không crash; kết quả gắn cờ FALLBACK_MODEL
    timeout_s: 240
    max_tokens: 2000
    temperature: 0.2
    prompt_version: opportunity_v1
  final_qc:                 # H8 — Sol, model KHÁC HẲN 2 gate trên để độc lập thật.
                            # HAI ĐƯỜNG DÂY tới CÙNG model (không phải 2 model khác nhau) — đổi
                            # đường không làm mất tính độc lập, mà tránh 1 proxy 503 là mất cả lane
                            # (đo thật 2026-09-22: hhtech 503 + auth_unavailable, ns24 trả 6s OK).
    chain:
      - [ns24, gpt-5.6-sol]
      - [hhtech, gpt-5.6-sol]
    timeout_s: 120
    max_tokens: 1500
    temperature: 0.1
    prompt_version: finalqc_v1
  feedback:                 # H11 — tổng hợp proposal, chạy tay
    chain:
      - [claude_cli, sonnet]
    timeout_s: 300
    max_tokens: 4000
    temperature: 0.3
    prompt_version: feedback_v1
  news_cluster:             # NEWS RADAR — gộp keyword 24h thành cụm sự kiện (bulk, rẻ; 1 call/lượt brief)
    chain:
      - [ramclouds, gemini-3.8-flash]
      - [ns24, gemini-3.8-flash]
      - [claude_cli, sonnet]
    timeout_s: 240
    max_tokens: 16000     # 150 keyword → 7.5k token output bị cụt ở 8k (đo 17/10)
    temperature: 0.1
    prompt_version: news_cluster_v2
  news_brief:               # NEWS RADAR — viết tiêu đề/góc kể/rủi ro cho từng đề tài top 10
    chain:
      - [ramclouds, gemini-3.8-flash]
      - [ns24, gemini-3.8-flash]
      - [claude_cli, sonnet]
    timeout_s: 150
    max_tokens: 2500
    temperature: 0.3
    prompt_version: news_brief_v1

  # ---------- TIẾT KIỆM QUOTA CLAUDE (anh duyệt 21/10/2026) ----------
  # Đo 07–21/10: subagent Opus 48%, dữ liệu thô in vào chat 15%, Claude tự viết file dài 12%.
  # 21/10 đổi (phương án 4, A/B data/lane_L_hunt_20261021/haiku_test): chạy chính Haiku/Sonnet 5.5 qua
  # claude_lite, ns24 dự phòng. CẤM claude_cli thường + alias "sonnet" trong gate ext_* (test canh).
  # Gọi qua src/ext_llm.py (ask_json / ask_text). Đổi model ở đây, không hard-code chỗ khác.
  ext_classify:             # phân loại + dịch tiêu đề hàng loạt (title_classify.py, hunt.py)
    chain:
      - [claude_lite, claude-haiku-5-5]
      - [ns24, deepseek-v4.1-flash]
      - [ns24, gemini-3.8-flash]
    effort: low
    timeout_s: 180
    max_tokens: 6000
    temperature: 0.1
    prompt_version: ext_classify_v1
  ext_hook:                 # phân tích hook 0–90s → HOOK_LIBRARY (hook_auto.py)
    chain:
      - [claude_lite, claude-sonnet-5-5]
      - [ns24, deepseek-v4-pro-0813]
      - [ns24, gpt-5.6-sol]
    effort: low
    timeout_s: 240
    max_tokens: 4000
    temperature: 0.2
    prompt_version: ext_hook_v1
  ext_comments:             # gán bình luận vào chủ đề (comment_topics.py) — tổng like do Python cộng
    chain:
      - [claude_lite, claude-haiku-5-5]
      - [ns24, deepseek-v4.1-flash]
      - [ns24, gemini-3.8-flash]
    timeout_s: 240
    max_tokens: 8000
    temperature: 0.1
    prompt_version: ext_comments_v1
  ext_extract:              # đọc trang tư liệu, trích số kèm câu NGUYÊN VĂN (source_extract.py)
    chain:
      - [claude_lite, claude-haiku-5-5]
      - [ns24, gpt-5.6-sol]
      - [hhtech, gpt-5.6-sol]
    timeout_s: 240
    max_tokens: 6000
    temperature: 0.0
    prompt_version: ext_extract_v1
  ext_draft:                # viết nháp hồ sơ/báo cáo từ JSON (draft_writer.py) — trả TEXT, không JSON
    chain:                  # A/B 21/10 cùng tu_lieu 生活保護: Sonnet 21s, 18/18 [Dn], tự ghi "(chưa có nguồn)";
      - [claude_lite, claude-sonnet-5-5]   # Sol 80s, 18/18 — data/lane_L_hunt_20261021/haiku_test/draft_ab
      - [ns24, gpt-5.6-sol]
      - [hhtech, gpt-5.6-sol]
    timeout_s: 420
    max_tokens: 16000
    temperature: 0.3
    prompt_version: ext_draft_v1

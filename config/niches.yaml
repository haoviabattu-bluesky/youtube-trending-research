# Ngách theo dõi. Đây là bản bootstrap — từ Phase 3 tool sẽ đọc tab TRD_CONFIG
# trên Google Sheet và file này chỉ còn là giá trị mặc định khi Sheet trống.
#
# hl/gl quyết định ngôn ngữ InnerTube trả về (ảnh hưởng parser số + tuổi video).
# windows: lát thời gian quét, luôn sort theo view count.

defaults:
  windows: [today, week, month]
  min_subs: 300            # sàn chống nhiễu — kênh 7 subs cho mult 2618x vô nghĩa
  max_ch_age_days: 1095    # trần 3 năm — loại CM/kênh chính phủ không nhân bản được
  min_duration_s: 180      # chỉ long-form, bỏ Shorts
  breakout_ratio: 3.0          # video >= 3x median CHÍNH KÊNH đó = bứt phá
  new_channel_days: 120
  new_channel_min_views: 50000
  # 🔁 PROVEN_NICHE — kênh có công thức chạy được (không phải video may mắn).
  # Dùng ch_mult = median_views / subs (độ ỔN ĐỊNH), KHÔNG dùng hit_rate (độ giật cục):
  # kênh nào mọi video đều 100k view sẽ có hit_rate ~0 nhưng ch_mult rất cao.
  # Hiệu chỉnh 2026-09-09 trên phân phối THẬT của 50 kênh: median-của-median = 3.104,
  # ngưỡng cũ (mult>=5, median>=20k) chỉ 2/50 kênh đạt → nhãn gần như không bao giờ bật.
  proven_ch_mult: 3.0        # video ĐIỂN HÌNH (không phải video tốt nhất) >= 3x số sub
  proven_min_videos: 8       # đủ video để loại trừ may mắn
  proven_min_median: 5000
  # Baseline chỉ tính cho kênh có video thật sự kéo được view — nếu không, xếp hạng theo
  # views/subs sẽ toàn kênh tí hon 1 video ăn may, đúng cái nhiễu đã gặp lúc probe.
  baseline_min_views: 10000
  # Báo cáo ngày là bản CHẮT LỌC, không phải bảng tra cứu. 10 video, mỗi kênh 1 video.
  # Toàn bộ dữ liệu thô vẫn nằm trong data/trending.db nếu cần đào lại.
  max_rows_per_channel: 1
  elite_min_ch_mult: 3.0     # video ĐIỂN HÌNH của kênh phải >= 3x số sub
  elite_min_views: 30000
  elite_min_rows: 5          # ít hơn mức này thì tự nới cổng
  new_rows_limit: 15         # tab TRD_NEW cũng gọn lại
  # 📈 RISING — phải ĐANG leo thật, không phải "có tăng chút đỉnh".
  # Ngưỡng >0 làm 58/117 video dính nhãn, vô dụng.
  rising_min_views_24h: 2000
  rising_min_share: 0.08     # >=8% tổng view đến trong 1 ngày = vẫn đang được đẩy
  # Giới hạn số kênh được tính baseline mỗi lượt (mỗi kênh tốn 2 quota)
  baseline_max_channels: 400
  baseline_recent_videos: 12
  baseline_min_age_days: 7   # bỏ video vừa đăng, chúng chưa kịp tích view
  daily_report_rows: 10
  deepdive_top_n: 10        # chỉ còn 10 video nên đào sâu HẾT, không chọn lọc lại
  deepdive_budget_s: 420    # trần thời gian cho cả bước đào sâu
  deepdive_comments: 50

